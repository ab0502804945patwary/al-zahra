<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AL ZAHRA ERP — Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #eef2fa; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #26394f; text-align: center; padding: 24px; }
    .card { background: #fff; border: 1px solid #dde5f4; border-radius: 16px; padding: 32px 28px; max-width: 360px; box-shadow: 0 4px 20px rgba(61, 95, 171, .08); }
    img { width: 72px; height: 72px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { font-size: 14px; color: #5b6b82; margin: 0 0 20px; line-height: 1.5; }
    button { background: #3d5fab; color: #fff; border: 0; border-radius: 10px; padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="AL ZAHRA">
    <h1 id="t">You are offline</h1>
    <p id="m">AL ZAHRA ERP needs an internet connection to show your latest data. Please check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
    <p style="margin:18px 0 0;font-size:12px"><a href="/api/signout" style="color:#3d5fab">Still stuck? Sign out and sign in again</a></p>
  </div>
  <script>
    // wording follows the real state: "offline" only when the device really has no network
    if (navigator.onLine) {
      document.getElementById('t').textContent = 'We could not reach the server'
      document.getElementById('m').textContent = 'Your device looks online, but AL ZAHRA ERP did not answer. This is usually a weak connection. Please try again in a moment.'
    }
    // come back by itself when the connection returns
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
